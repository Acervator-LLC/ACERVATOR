[profile.default]
src = "contracts"
# tests/ holds every test in this repository, so forge reads its Solidity from there.
test = "tests/contracts"
out = "out"
libs = ["node_modules"]
cache_path = "cache/forge"

solc = "0.8.36"
evm_version = "cancun"

# AcervatorTrophy.mint exceeds the legacy pipeline stack limit; solc names via_ir as the fix.
via_ir = true
optimizer = true

remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "@chainlink/contracts/=node_modules/@chainlink/contracts/",
]

[invariant]
runs = 256
depth = 64
fail_on_revert = false
