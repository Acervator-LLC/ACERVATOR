# vale configuration — added v3.24.34 (C43 follow-on).
#
# Without this file vale exits 2 with "E100 [.vale.ini not found]" and
# writes its error to STDERR with an EMPTY stdout. docs_archetype's
# _run_vale used to treat that as a clean run and report "ok"; it now
# raises instead. Both halves had to land together: installing the
# binary without this config made the archetype report a passing vale
# that had checked nothing.
#
# STYLE CHOICE — deliberately light.
# Google and Microsoft house styles are written for product
# documentation with a controlled vocabulary. Pointed at this repo's
# ~90 audit documents they produce thousands of alerts about contraction
# use and heading capitalisation, none of which bear on whether an audit
# is correct. write-good targets the things that actually damage a
# technical document: passive voice hiding the actor, weasel words
# standing in for a measurement, and needless complexity.
#
# proselint is NOT enabled here — docs_archetype already runs proselint
# as a separate tool, and vale ships its own proselint port. Enabling it
# would double-report every finding.

StylesPath = .vale/styles

# Alerts below this level are dropped. `suggestion` is the noisiest
# tier; warning keeps the signal that matters.
MinAlertLevel = warning

Packages = write-good

# Trading/domain vocabulary and proper nouns live here so they are not
# flagged as misspellings or jargon. Must be declared with the core
# options -- vale rejects `Vocab` if it appears below a syntax-specific
# `[...]` section.
Vocab = Acervator

[*.md]
BasedOnStyles = write-good
