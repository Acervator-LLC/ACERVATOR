# Acervator CI — the checks a pull request must pass before it can merge.
#
# Four lanes, and each one adjudicates something this repository actually holds:
#
#   * changes    — diffs the push or pull request and publishes the changed file
#                  list the archetype lane reads, plus two flags: `any` (the diff
#                  is non-empty) and `code` (at least one changed file can affect
#                  the build). Always runs.
#   * lint       — black --check and flake8 over `src tests tools *.py`, from the
#                  [lint] extra. Runs when `code` is true.
#   * contracts  — `forge test` over tests/contracts, the six Solidity test files
#                  that are the only tests in the tree. foundry.toml resolves its
#                  libraries from node_modules, so `npm ci` runs first. Runs when
#                  `code` is true.
#   * archetypes — runs the archetype that owns each changed file: coding for
#                  .py, .sh/.bash/.zsh and .yml/.yaml, gui for
#                  .js/.mjs/.cjs/.css/.html, docs for .md. A file of
#                  any other extension has no owning archetype; the step names it
#                  and counts it as unowned. A known-bad fixture under
#                  harness_fixtures/ is named and counted as exempt, because that
#                  file exists to report passed=false. The lane fails when any
#                  archetype reports passed=false on a file that is not one.
#                  Runs when `any` is true, so a documentation-only pull request
#                  is still adjudicated.
#
# There are no pytest lanes. `git ls-files tests/` returns 7 files: six Solidity
# tests and conftest.py. No `test_*.py` exists, so pytest collected nothing and
# exited 5 on every run, for a reason that was never the change under it.
#
# Python version: ONE version, pinned in `.python-version` at the repo root and
# read from there by every job (`python-version-file`). Acervator targets a
# single interpreter — the app is headed for a SaaS deployment where local
# installs are for testing only, so there is exactly one supported runtime and
# CI never fans out across versions. To move the whole project to a new Python,
# edit `.python-version` (and `requires-python` in pyproject.toml); nothing here.
#
# `ci-gate` is the single status the repository ruleset requires. It always runs,
# and it passes when no required lane failed — a lane skipped because the change
# did not call for it counts as acceptable, so a documentation-only pull request
# is never wedged by a lane reporting "skipped" rather than "success". Requiring
# the lanes by name would wedge exactly those pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Lets every lane be run on demand against any branch from the Actions tab.
  workflow_dispatch:

# A newer push to the same ref cancels the older, still-running CI for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Publishes the changed file list and the two flags the lanes below read.
    # `code=false` means every changed file is non-functional (docs, *.md,
    # .claude/, license/ignore metadata), so the lint and contracts lanes are
    # skipped and no runner time is spent on them. The archetype lane reads
    # `any` instead, because the docs archetype adjudicates markdown.
    name: changes
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.detect.outputs.any }}
      code: ${{ steps.detect.outputs.code }}
      files: ${{ steps.detect.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the base commit of the diff is present locally.
          fetch-depth: 0
      - name: Detect functional changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail

          # Paths that never affect the build. If EVERY changed file matches one
          # of these, the lint and contracts lanes are skipped. Anything not
          # matched here is treated as functional, so the list is deliberately
          # conservative — add to it, don't broaden it.
          IGNORE='^\.claude/|^docs/|\.md$|^LICENSE$|^\.gitignore$|^\.gitattributes$|^\.editorconfig$'

          case "$EVENT_NAME" in
            pull_request) BASE="$PR_BASE_SHA"; HEAD="$PR_HEAD_SHA" ;;
            push)         BASE="$PUSH_BEFORE"; HEAD="$PUSH_AFTER" ;;
            *)            BASE="";             HEAD="$PUSH_AFTER" ;;
          esac

          # A zeroed base (first push to a ref, or a force-push) and a manual
          # dispatch both have no base to diff against. The head's own parent is
          # a real one, so the archetype lane always reads a real file list
          # instead of an empty one that would pass having scanned nothing.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse --verify --quiet "${HEAD}^" || true)"
          fi

          if [ -n "$BASE" ]; then
            CHANGED="$(git diff --name-only "$BASE" "$HEAD")"
          else
            CHANGED=""
          fi
          echo "Base: ${BASE:-none}"
          echo "Changed files:"; echo "$CHANGED"

          # A multiline job output needs a delimiter GitHub reads back whole.
          {
            echo 'files<<ACERVATOR_CHANGED_FILES'
            printf '%s\n' "$CHANGED"
            echo 'ACERVATOR_CHANGED_FILES'
          } >> "$GITHUB_OUTPUT"

          if [ -n "$CHANGED" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

          # A draft pull request is not asking for a verdict, so the code lanes
          # are skipped. Without this a long-lived draft re-runs everything every
          # time anything merges into its base branch.
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$PR_DRAFT" = "true" ]; then
            echo "Draft pull request - skipping code lanes."
            echo "code=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # A manual dispatch asks for every lane, whatever the diff holds.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BASE" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          CODE_FILES="$(printf '%s\n' "$CHANGED" | grep -vE "$IGNORE" || true)"
          if [ -n "$CODE_FILES" ]; then
            echo "Functional changes detected — running the code lanes."
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only non-functional files changed — skipping the code lanes."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install lint tooling
        # From the [lint] extra, not a list here: pyproject.toml is the one
        # dependency source.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[lint]"
      - name: black --check (formatting)
        run: black --check --diff src tests tools *.py
      - name: flake8 (lint)
        run: flake8 src tests tools *.py

  contracts:
    # The six files under tests/contracts are the only tests in the tree.
    name: contracts
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # package-lock.json was written by npm 11, which ships with node 24.
          # Node 22 carries npm 10, and npm 10 reads that lock file as out of
          # sync with the aliased @openzeppelin overrides and refuses `npm ci`.
          node-version: '24'
          cache: npm
      - name: Install the Solidity libraries
        # foundry.toml sets libs = ["node_modules"], so forge resolves
        # @openzeppelin and @chainlink out of what npm installs.
        run: npm ci
      - uses: foundry-rs/foundry-toolchain@v1
      - name: forge test
        run: forge test -vv

  archetypes:
    # Each changed file, through the archetype that owns its type.
    name: archetypes
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    env:
      # gui_archetype imports PySide6; run it without a display server.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - uses: actions/setup-node@v4
        with:
          # See the contracts lane: npm 10 refuses this lock file.
          node-version: '24'
          cache: npm
      - name: Cache installed Python packages
        # [dev] carries the analyzers the archetypes shell out to, and PySide6
        # alone is ~1.2 GB installed. Caching the interpreter tree means that
        # cost is paid only when the dependency set changes.
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}
          key: py-arch-${{ env.pythonLocation }}-${{ hashFiles('pyproject.toml', '.python-version') }}
      - name: Install Qt runtime libraries
        # PySide6 needs these shared libs to import even under the offscreen
        # platform plugin; the GitHub Ubuntu image does not ship them.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install project + analyzer toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install the JavaScript, CSS and HTML analyzers
        # gui_archetype runs eslint, stylelint and html-validate out of
        # node_modules at the repository root.
        run: npm ci
      - name: Install vale (the prose analyzer docs_archetype requires)
        # vale is a Go binary, not pip-installable, and an absent required
        # analyzer makes the archetype report fail closed.
        run: |
          VALE_VERSION=3.7.1
          curl -sSL -o /tmp/vale.tar.gz \
            "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          sudo tar -xzf /tmp/vale.tar.gz -C /usr/local/bin vale
          vale --version
      - name: Run the owning archetype on each changed file
        env:
          CHANGED_FILES: ${{ needs.changes.outputs.files }}
        run: |
          set -uo pipefail
          # Without this, the first red archetype ends the step and the
          # remaining files are never read.
          set +e

          scanned=0
          unowned=0
          exempt=0
          failed=0

          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if [ ! -f "$path" ]; then
              echo "deleted by this change, nothing to scan: $path"
              continue
            fi
            # A known-bad fixture exists to report passed=false; that is how the
            # harness proves a rule can fail at all. Judging one makes every new
            # archetype rule red, because a rule ships with a known_good and a
            # known_bad fixture. The three naming shapes the tree uses, each
            # anchored to harness_fixtures/ so no source file is ever exempt:
            #   known_bad.<ext> and known_bad_<rule>.<ext>
            #   <subject>_bad.<ext>
            #   <subject>_bad/<file>          the fixture is a whole directory
            case "$path" in
              harness_fixtures/*/known_bad.*|harness_fixtures/*/known_bad_*|\
              harness_fixtures/*_bad.*|harness_fixtures/*_bad/*)
                echo "known-bad fixture, built to report passed=false: $path"
                exempt=$((exempt + 1))
                continue
                ;;
            esac
            case "$path" in
              *.py)                          module=coding_archetype ;;
              *.sh|*.bash|*.zsh)             module=coding_archetype ;;
              *.yml|*.yaml)                  module=coding_archetype ;;
              *.js|*.mjs|*.cjs|*.css|*.html) module=gui_archetype ;;
              *.md)                          module=docs_archetype ;;
              *)
                echo "no owning archetype: $path"
                unowned=$((unowned + 1))
                continue
                ;;
            esac
            echo "::group::$module $path"
            python -m "dev_harness.harness.$module" "$path"
            code=$?
            echo "::endgroup::"
            scanned=$((scanned + 1))
            if [ "$code" -eq 0 ]; then
              echo "$module $path passed=true"
            else
              echo "$module $path passed=false (exit $code)"
              failed=$((failed + 1))
            fi
          done <<< "$CHANGED_FILES"

          echo "scanned=$scanned unowned=$unowned exempt=$exempt failed=$failed"
          [ "$failed" -eq 0 ]

  ci-gate:
    # The single stable status the repository ruleset requires. It always runs —
    # even when a lane was skipped because the change did not call for it — and
    # passes only when no required lane actually failed.
    name: ci-gate
    if: always()
    needs: [changes, lint, contracts, archetypes]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required lanes
        env:
          CHANGES: ${{ needs.changes.result }}
          LINT: ${{ needs.lint.result }}
          CONTRACTS: ${{ needs.contracts.result }}
          ARCHETYPES: ${{ needs.archetypes.result }}
        run: |
          set -euo pipefail
          fail=0

          # `changes` always runs, so only success is acceptable there.
          if [ "$CHANGES" != "success" ]; then
            echo "changes: $CHANGES — FAILED"; fail=1
          else
            echo "changes: success — ok"
          fi

          # A lane is acceptable when it succeeded or was skipped; skipped means
          # the change did not call for it. Any other result fails the gate.
          for name in LINT CONTRACTS ARCHETYPES; do
            result="$(eval "echo \$$name")"
            case "$result" in
              success|skipped) echo "$name: $result — ok" ;;
              *)               echo "$name: $result — FAILED"; fail=1 ;;
            esac
          done

          exit "$fail"
