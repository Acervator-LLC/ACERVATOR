# Acervator CI — the mechanism that replaces the local pre-push gate.
#
# History: enforcement used to live in a git `pre-push` hook
# (.githooks/pre-push) that refused to push a commit the local release gate
# had not stamped. A local hook only binds a clone that opted into it
# (`git config core.hooksPath .githooks`), so it protected nothing on a fresh
# clone or in review. This workflow moves that enforcement to the server:
# every push and pull request runs the real checks, and the branch-protection
# rule "require status checks to pass before merging" is what actually keeps
# ungated code off the default branch.
#
# To finish the conversion, enable in the repo settings:
#   Settings → Branches → Branch protection for `main`:
#     - Require a pull request before merging
#     - Require status checks to pass: select "lint" and "test (3.12)"
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref cancels the older, still-running CI for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install black flake8
      - name: black --check (formatting)
        run: black --check --diff src tests tools *.py
      - name: flake8 (lint)
        run: flake8 src tests tools *.py

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # PySide6 widgets are constructed in the suite; run them without a
      # display server. The conftest redirects all runtime-tree writes to
      # temp dirs, so nothing touches a real ~/.acervator tree.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qt runtime libraries
        # PySide6 needs these shared libs to import even under the offscreen
        # platform plugin; the GitHub Ubuntu image does not ship them.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install project + dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run test suite
        run: pytest -q
