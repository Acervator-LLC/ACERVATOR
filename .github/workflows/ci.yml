# Acervator CI — the mechanism that replaces the local pre-push gate.
#
# History: enforcement used to live in a git `pre-push` hook
# (.githooks/pre-push) that refused to push a commit the local release gate
# had not stamped. A local hook only binds a clone that opted into it
# (`git config core.hooksPath .githooks`), so it protected nothing on a fresh
# clone or in review. This workflow moves that enforcement to the server:
# every push and pull request runs the real checks, and the branch-protection
# rule "require status checks to pass before merging" is what actually keeps
# ungated code off the default branch.
#
# Two test lanes, so a PR gets a fast signal without losing coverage:
#   * test       — FAST lane, every push and PR. Installs the lean [test]
#                  extra only and runs `-m "not slow and not archetype"` with
#                  `pytest -n auto` process parallelism.
#   * test-full  — FULL lane, on push to `main` and manual dispatch. Installs
#                  the heavy [dev] analyzer toolchain + vale and runs the
#                  complement (`-m "slow or archetype"`). The engine-replay
#                  suites and archetype-harness tests live here; they are
#                  minutes of CPU and/or need semgrep/opencv/vale, none of
#                  which the fast lane pays for.
#
# Early bail on non-functional changes: a `changes` job diffs the push/PR and
# decides whether anything that can affect the build or tests actually changed.
# When only non-functional files did (docs, *.md, .claude/, license/ignore
# metadata), the lint and test lanes are skipped entirely so no runner wall time
# is spent on them. The `ci-gate` job still reports a green status in that case,
# so a docs-only change is never blocked by a "skipped" required check.
#
# Python version: ONE version, pinned in `.python-version` at the repo root and
# read from there by every job (`python-version-file`). Acervator targets a
# single interpreter — the app is headed for a SaaS deployment where local
# installs are for testing only, so there is exactly one supported runtime and
# CI never fans out across versions. To move the whole project to a new Python,
# edit `.python-version` (and `requires-python` in pyproject.toml); nothing here.
#
# To finish the pre-push→CI conversion, enable in the repo settings:
#   Settings → Branches → Branch protection for `main`:
#     - Require a pull request before merging
#     - Require status checks to pass: select "ci-gate".
#       ci-gate is the single stable check that aggregates the lint and test
#       lanes: it passes when they succeed OR when they were skipped because the
#       change was non-functional. Requiring the lanes ("lint"/"test") directly
#       would instead wedge every docs-only PR, whose lanes report "skipped"
#       rather than "success". ("test-full" runs post-merge on main and on demand.)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the full lane be run on demand against any branch from the Actions tab.
  workflow_dispatch:

# A newer push to the same ref cancels the older, still-running CI for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Decides whether this push/PR touches anything that can affect the build or
    # the test suite. `code=false` means every changed file is non-functional
    # (docs, *.md, .claude/, license/ignore metadata), and the lint/test lanes
    # below are skipped so no runner time is spent on them.
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the base commit of the diff is present locally.
          fetch-depth: 0
      - name: Detect functional changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Paths that never affect the build or the test suite. If EVERY changed
          # file matches one of these, the code lanes are skipped. Anything not
          # matched here is treated as functional and runs the full suite, so the
          # list is deliberately conservative — add to it, don't broaden it.
          IGNORE='^\.claude/|^docs/|\.md$|^LICENSE$|^\.gitignore$|^\.gitattributes$|^\.editorconfig$'

          case "$EVENT_NAME" in
            pull_request) BASE="$PR_BASE_SHA"; HEAD="$PR_HEAD_SHA" ;;
            push)         BASE="$PUSH_BEFORE"; HEAD="$PUSH_AFTER" ;;
            *)
              # workflow_dispatch or anything else: no reliable diff — run all.
              echo "code=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac

          # A zeroed base (first push to a ref, or a force-push) has no comparable
          # history — fall back to running the full suite.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          CHANGED="$(git diff --name-only "$BASE" "$HEAD")"
          echo "Changed files:"; echo "$CHANGED"

          CODE_FILES="$(printf '%s\n' "$CHANGED" | grep -vE "$IGNORE" || true)"
          if [ -n "$CODE_FILES" ]; then
            echo "Functional changes detected — running code lanes."
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only non-functional files changed — skipping code lanes."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install lint tooling
        # From the [lint] extra, not a list here: pyproject.toml is the one
        # dependency source and tests/test_one_dependency_source.py enforces it.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[lint]"
      - name: black --check (formatting)
        run: black --check --diff src tests tools *.py
      - name: flake8 (lint)
        run: flake8 src tests tools *.py

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      # PySide6 widgets are constructed in the suite; run them without a
      # display server. The conftest redirects all runtime-tree writes to
      # temp dirs, so nothing touches a real ~/.acervator tree.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Cache installed Python packages
        # PySide6 alone is ~1.2 GB installed, so a cold `pip install` spends
        # ~40s just unpacking it. Caching the whole interpreter tree
        # (env.pythonLocation is where setup-python installs packages) means
        # that cost is paid only when the dependency set actually changes —
        # the key is keyed to pyproject.toml + the interpreter. On a hit the
        # install step below is a no-op verification (~5s). The `-test` key
        # namespace keeps this lane's lean env separate from test-full's [dev].
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}
          key: py-test-${{ env.pythonLocation }}-${{ hashFiles('pyproject.toml', '.python-version') }}
      - name: Install Qt runtime libraries
        # PySide6 needs these shared libs to import even under the offscreen
        # platform plugin; the GitHub Ubuntu image does not ship them.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install project + lean test dependencies
        # [test] only — pytest + asyncio/qt plugins + xdist. The heavy
        # analyzers (semgrep/mypy/vulture/opencv) and vale live in [dev] and
        # are needed only by the archetype tests, which this lane deselects.
        # A no-op on a package-cache hit; a full install on a miss.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run fast test suite
        # `-n auto` fans the CPU-bound suite across every available core;
        # `-m "not slow and not archetype"` drops the engine-replay and
        # analyzer-backed tests, which run in the full lane.
        run: pytest -n auto -m "not slow and not archetype" -q

  test-full:
    name: test-full
    # Post-merge on main, and on-demand. NOT on pull_request — that is what
    # keeps PR feedback fast. Also skipped when the push changed only
    # non-functional files (workflow_dispatch always reports code=true).
    needs: changes
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Cache installed Python packages
        # [dev] adds semgrep + opencv + mypy on top of PySide6 — several
        # hundred MB more. Caching the interpreter tree makes the full-lane
        # install a no-op except when dependencies change. Separate `-full`
        # key namespace so this heavier env never restores into the fast lane.
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}
          key: py-full-${{ env.pythonLocation }}-${{ hashFiles('pyproject.toml', '.python-version') }}
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install project + dev dependencies
        # A no-op on a package-cache hit; a full install on a miss.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install vale (docs-archetype prose linter)
        # `vale` is a Go binary, not pip-installable, and the docs archetype
        # (dev_harness/harness/docs_archetype.py) requires it — an absent required
        # analyzer makes ArchetypeReport.passed fail closed. The pip analyzers
        # (ruff/bandit/mypy/vulture/semgrep/proselint) come in via .[dev].
        run: |
          VALE_VERSION=3.7.1
          curl -sSL -o /tmp/vale.tar.gz \
            "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          sudo tar -xzf /tmp/vale.tar.gz -C /usr/local/bin vale
          vale --version
      - name: Run full (slow + archetype) test suite
        run: pytest -n auto -m "slow or archetype" -q

  ci-gate:
    # Single stable status for branch protection. It always runs — even when the
    # code lanes were skipped for a non-functional change — and passes iff no
    # required lane actually failed. Require THIS check instead of lint/test, so
    # a docs-only PR whose lanes were skipped still reports a green required
    # status and can merge.
    name: ci-gate
    if: always()
    needs: [changes, lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required lanes
        env:
          CHANGES: ${{ needs.changes.result }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          fail=0

          # `changes` always runs, so only success is acceptable there.
          if [ "$CHANGES" != "success" ]; then
            echo "changes: $CHANGES — FAILED"; fail=1
          else
            echo "changes: success — ok"
          fi

          # A lane is acceptable when it succeeded or was skipped; skipped means
          # the change was non-functional. Any other result fails the gate.
          for name in LINT TEST; do
            result="$(eval "echo \$$name")"
            case "$result" in
              success|skipped) echo "$name: $result — ok" ;;
              *)               echo "$name: $result — FAILED"; fail=1 ;;
            esac
          done

          exit "$fail"
