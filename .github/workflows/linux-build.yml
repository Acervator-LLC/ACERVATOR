---
name: Linux build

"on":
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - Acervator_linux.spec
      - tools/build_variants.py
      - tools/spec_common.py
      - tools/deps.py
      - pyproject.toml
      - .python-version
      - .github/workflows/linux-build.yml

concurrency:
  group: linux-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LAUNCH_ROOT: ${{ github.workspace }}/launch
      IMPORT_ROOT: ${{ github.workspace }}/launch/import
      READY_LINE: main window displayed
      USERNS_RESTRICT: kernel.apparmor_restrict_unprivileged_userns
      LAUNCH_WAIT_SECONDS: 180
      SETTLE_SECONDS: 20
      APPIMAGETOOL_VERSION: 1.9.1
      APPIMAGETOOL_SHA256: >-
        ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
      RUNTIME_VERSION: "20251108"
      RUNTIME_SHA256: >-
        2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Report the runner and the version the build will carry
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          uname -m
          grep PRETTY_NAME /etc/os-release
          python -V
          python -c 'import src; print("version:", src.__version__)'
          env_var="$(python -m tools.build_variants env-var)"
          variants="$(python -m tools.build_variants select | tr '\n' ' ')"
          echo "variant variable: $env_var"
          echo "variants: $variants"
          echo "VARIANT_ENV_VAR=$env_var" >> "$GITHUB_ENV"
          echo "VARIANTS=$variants" >> "$GITHUB_ENV"

      - name: Install the libraries the Qt build loads, the display and FUSE
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb x11-utils fuse3 \
            libegl1 libgl1 libopengl0 libfontconfig1 libfreetype6 \
            libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libxcb-xfixes0 libxcb-sync1 \
            libxcb-shm0 libnss3 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libxkbfile1 libxshmfence1 libgbm1 libasound2t64

      - name: Download appimagetool and its runtime, and check each digest
        run: |
          set -euo pipefail
          releases="https://github.com/AppImage"
          tools="$RUNNER_TEMP/appimage"
          tool="$tools/appimagetool"
          runtime="$tools/runtime-x86_64"
          mkdir -p "$tools"
          curl -fsSL -o "$tool" \
            "$releases/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-x86_64.AppImage"
          curl -fsSL -o "$runtime" \
            "$releases/type2-runtime/releases/download/$RUNTIME_VERSION/runtime-x86_64"
          echo "$APPIMAGETOOL_SHA256  $tool" | sha256sum -c -
          echo "$RUNTIME_SHA256  $runtime" | sha256sum -c -
          chmod +x "$tool"
          "$tool" --appimage-extract-and-run --version
          echo "APPIMAGETOOL=$tool" >> "$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME=$runtime" >> "$GITHUB_ENV"

      - name: Install what the build needs
        run: |
          set -euo pipefail
          mapfile -t requirements < <(python -m tools.deps requirements build)
          echo "requirements: ${#requirements[@]}"
          test "${#requirements[@]}" -gt 0
          python -m pip install --upgrade pip
          python -m pip install "${requirements[@]}"
          python -m PyInstaller --version
          python -m pip show keyring SecretStorage jeepney \
            | grep -E '^(Name|Version):'

      - name: Build both variants, each laid out as an AppDir
        run: |
          set -euo pipefail
          for variant in $VARIANTS; do
            echo "=== building the $variant variant ==="
            env "$VARIANT_ENV_VAR=$variant" \
              python -m PyInstaller Acervator_linux.spec --noconfirm
          done
          ls -l dist

      - name: Pack each AppDir into one AppImage
        run: |
          set -euo pipefail
          for variant in $VARIANTS; do
            appdir="$(find dist -maxdepth 1 -type d -name "*-$variant")"
            test -n "$appdir"
            ls -l "$appdir/AppRun" "$appdir"/*.desktop "$appdir"/*.png
            cat "$appdir"/*.desktop
            ARCH=x86_64 "$APPIMAGETOOL" --appimage-extract-and-run \
              --no-appstream --runtime-file "$APPIMAGE_RUNTIME" \
              "$appdir" "$appdir.AppImage"
          done
          ls -l dist/*.AppImage

      - name: Read every AppImage back with its byte size
        run: |
          set -uo pipefail
          fail=0
          for variant in $VARIANTS; do
            appdir="$(find dist -maxdepth 1 -type d -name "*-$variant")"
            name="$(basename "$appdir")"
            image="$appdir.AppImage"
            if [ ! -f "$image" ]; then
              echo "MISSING: no AppImage for the $variant variant"
              fail=1
              continue
            fi
            echo "$variant  appimage  $(basename "$image")"
            echo "$variant  appimage  $(stat -c%s "$image") bytes"
            peek="$RUNNER_TEMP/peek-$variant"
            rm -rf "$peek"
            mkdir -p "$peek"
            (cd "$peek" && "$GITHUB_WORKSPACE/$image" --appimage-extract \
              > /dev/null)
            inside="$peek/squashfs-root"
            built="$(sha256sum "$appdir/$name" | cut -d' ' -f1)"
            shipped="$(sha256sum "$inside/$name" | cut -d' ' -f1)"
            echo "built   executable sha256 $built"
            echo "shipped executable sha256 $shipped"
            if [ "$built" != "$shipped" ]; then
              echo "MISMATCH: the AppImage does not carry the built executable"
              fail=1
            fi
            baked="$(cat "$inside/_internal/src/_baked_variant.txt" \
                     2>/dev/null || echo ABSENT)"
            echo "$variant  baked     $baked"
            if [ "$baked" != "$variant" ]; then
              echo "WRONG VARIANT BAKED into $image"
              fail=1
            fi
            echo "$variant  AppRun -> $(readlink "$inside/AppRun")"
            rm -rf "$peek"
            modules="$RUNNER_TEMP/modules-$variant.txt"
            pyi-archive_viewer --list --recursive --brief "$appdir/$name" \
              > "$modules"
            echo "$variant  archive   $(wc -l < "$modules") entries"
            grep -F keyring.backends "$modules"
            wanted="keyring.backends.SecretService secretstorage jeepney"
            for module in $wanted; do
              if grep -qF "$module" "$modules"; then
                echo "$variant  bundles   $module"
              else
                echo "MISSING from $name: $module"
                fail=1
              fi
            done
            echo
          done
          exit "$fail"

      - name: Read how the kernel treats unprivileged user namespaces
        run: |
          set -euo pipefail
          echo "kernel $(uname -r)"
          aa_enabled=/sys/module/apparmor/parameters/enabled
          echo "apparmor enabled: $(cat "$aa_enabled")"
          for key in "$USERNS_RESTRICT" \
            kernel.unprivileged_userns_clone user.max_user_namespaces; do
            echo "$key = $(sysctl -n "$key" 2>/dev/null || echo ABSENT)"
          done
          echo "--- the sysctl.d files that set the restriction"
          dirs=()
          for dir in /usr/lib/sysctl.d /etc/sysctl.d /run/sysctl.d; do
            if [ -d "$dir" ]; then
              dirs+=("$dir")
            fi
          done
          echo "sysctl.d folders on this runner: ${dirs[*]}"
          grep -rH "$USERNS_RESTRICT" "${dirs[@]}" \
            || echo "no sysctl.d file names $USERNS_RESTRICT"
          dpkg -S /usr/lib/sysctl.d/10-apparmor.conf || true
          shipped="$(sysctl -n "$USERNS_RESTRICT")"
          echo "USERNS_RESTRICT_SHIPPED=$shipped" >> "$GITHUB_ENV"

      - name: Launch each AppImage, the namespace restriction off then on
        env:
          DISPLAY: ":99"
        run: |
          set -uo pipefail
          mkdir -p "$LAUNCH_ROOT"
          Xvfb "$DISPLAY" -screen 0 1920x1080x24 -nolisten tcp \
            > "$LAUNCH_ROOT/xvfb.txt" 2>&1 &
          for _ in $(seq 1 30); do
            xdpyinfo > /dev/null 2>&1 && break
            sleep 1
          done
          echo "display $DISPLAY: $(xdpyinfo | grep -m1 dimensions)"

          own_userns="$(readlink /proc/self/ns/user)"
          web_engine_report() {
            local label="$1" pids p args kind flag status seccomp nspid userns
            pids="$(pgrep -f QtWebEngineProcess || true)"
            echo "$label QtWebEngineProcess count: $(grep -c . <<< "$pids")"
            for p in $pids; do
              args="$(tr '\0' ' ' < "/proc/$p/cmdline" 2>/dev/null)"
              kind="$(grep -o -m1 -- '--type=[a-z-]*' <<< "$args" || echo main)"
              case "$args" in
                *--no-sandbox*) flag=no-sandbox ;;
                *) flag=sandbox ;;
              esac
              status="/proc/$p/status"
              seccomp="$(awk '/^Seccomp:/{print $2}' "$status" 2>/dev/null)"
              nspid="$(awk '/^NSpid:/{$1=""; print}' "$status" 2>/dev/null)"
              userns=own
              if [ "$(sudo readlink "/proc/$p/ns/user")" = "$own_userns" ]; then
                userns=shared
              fi
              echo "$label pid $p $kind $flag" \
                "seccomp=$seccomp userns=$userns nspid=$nspid"
            done
          }

          fail=0
          for restrict in 0 1; do
            sudo sysctl -w "$USERNS_RESTRICT=$restrict"
            held="$(sysctl -n "$USERNS_RESTRICT")"
            if [ "$held" != "$restrict" ]; then
              echo "FAILURE: the restriction reads $held, not $restrict"
              fail=1
              continue
            fi
            setting="restrict-$held"
            for variant in $VARIANTS; do
              appdir="$(find dist -maxdepth 1 -type d -name "*-$variant")"
              name="$(basename "$appdir")"
              image="$GITHUB_WORKSPACE/$appdir.AppImage"
              home="$LAUNCH_ROOT/$setting/$variant"
              logs="$home/.acervator_logs"
              rm -rf "$home"
              mkdir -p "$home/tmp"

              echo "=================================================="
              echo "=== $setting: launching $(basename "$image")"
              echo "=== HOME is launch/$setting/$variant"
              echo "=== the runner shipped restrict-$USERNS_RESTRICT_SHIPPED"
              echo "=================================================="
              web_engine_report "before $setting $variant"
              env -i \
                PATH="/usr/bin:/bin" \
                HOME="$home" \
                TMPDIR="$home/tmp" \
                LANG=C.UTF-8 \
                DISPLAY="$DISPLAY" \
                ACERVATOR_DEBUG_BOOT=1 \
                "$image" > "$home/stdout.txt" 2> "$home/stderr.txt" &
              pid=$!
              echo "pid $pid"

              ready=timeout
              for _ in $(seq 1 "$LAUNCH_WAIT_SECONDS"); do
                if grep -rqs "$READY_LINE" "$logs"; then
                  ready=log
                  break
                fi
                if ! kill -0 "$pid" 2>/dev/null; then
                  ready=died
                  break
                fi
                sleep 1
              done
              echo "--- $setting $variant reported its window through: $ready"
              if [ "$ready" = log ]; then
                sleep "$SETTLE_SECONDS"
              fi

              echo "--- the main window line, from its own log tree"
              (cd "$home" && grep -rHs "$READY_LINE" .acervator_logs) \
                || echo "NO main window line"

              echo "--- pages that failed to load"
              (cd "$home" && grep -rHs "failed to load" .acervator_logs) \
                || echo "no page failed to load"

              echo "--- heartbeat.txt, which only a running event loop writes"
              cat "$logs/heartbeat.txt" 2>/dev/null \
                || echo "NO HEARTBEAT: the event loop never ran"

              echo "--- the web engine processes while $variant runs"
              web_engine_report "$setting $variant"

              echo "--- the windows named Acervator on the display"
              xwininfo -root -tree > "$home/windows.txt" 2>&1 || true
              grep -i acervator "$home/windows.txt" | head -5 \
                || echo "NO window named Acervator"

              echo "--- the last 40 lines of its system.log"
              sysl="$(find "$logs" -name system.log | head -1)"
              if [ -n "$sysl" ]; then
                tail -40 "$sysl"
              else
                echo "NO system.log"
              fi

              echo "--- the last 40 lines of its stderr"
              tail -40 "$home/stderr.txt" || true
              echo "--- the last 20 lines of its stdout"
              tail -20 "$home/stdout.txt" || true

              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
              pkill -f "$name" 2>/dev/null || true
              pkill -f QtWebEngineProcess 2>/dev/null || true
              for _ in $(seq 1 30); do
                [ "$(pgrep -f "$name" | wc -l)" = "0" ] && break
                sleep 1
              done
              echo "--- reaped pid $pid; left: $(pgrep -f "$name" | wc -l)"

              if [ "$ready" != log ]; then
                echo "FAILURE: $setting $variant never logged its main window"
                fail=1
              fi
              echo
            done
          done
          sudo sysctl -w "$USERNS_RESTRICT=$USERNS_RESTRICT_SHIPPED"
          exit "$fail"

      # StateManager.save_state writes the fleet file, from two ScrummingBot
      # records get_full_state exports.
      - name: Write a fleet file and a file that is not one into each home
        shell: python
        env:
          PYTHONPATH: ${{ github.workspace }}
          HOME: ${{ github.workspace }}/launch/import-maker
        run: |
          import os
          from pathlib import Path

          from src.core.state_manager import StateManager
          from src.trading.container.config import BotMode, make_bot_config
          from src.trading.container.restore import (
              _PlaceholderExchangeForRestore,
          )
          from src.trading.scrumming_bot import ScrummingBot

          root = Path(os.environ["IMPORT_ROOT"])
          for variant in os.environ["VARIANTS"].split():
              files = root / variant / "fleet-files"
              records = []
              for asset in ("ALGO", "ATOM"):
                  config = make_bot_config(
                      BotMode.SCRUMMING,
                      exchange_id="coinbase",
                      base_currency="EUR",
                      target_asset=asset,
                  )
                  venue = _PlaceholderExchangeForRestore("coinbase")
                  bot = ScrummingBot(config, venue)
                  records.append(bot.get_full_state())
              StateManager(config_dir=files).save_state(records)
              not_fleet = files / "not_a_fleet.json"
              not_fleet.write_text("this file holds no fleet\n", "utf-8")
              for path in sorted(files.iterdir()):
                  size = path.stat().st_size
                  print(f"{variant} wrote {path.name}, {size} bytes")
              ids = [one["bot_id"] for one in records]
              print(f"{variant} fleet file bots: {ids}")

      # libatspi reads and drives the AT-SPI tree: https://docs.gtk.org/atspi2/
      - name: Install AT-SPI, which presses the import and answers the picker
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            at-spi2-core gir1.2-atspi-2.0 python3-gi dbus python3-pil
          dpkg-query -W at-spi2-core gir1.2-atspi-2.0 python3-gi

      - name: Press the fleet import in each AppImage and read what it wrote
        shell: /usr/bin/python3 {0}
        run: |
          import hashlib
          import json
          import os
          import re
          import signal
          import subprocess
          import sys
          import time
          import traceback
          from pathlib import Path

          DISPLAY = ":98"
          # AT-SPI names a Qt window by its accessible name, else its title.
          DIALOG = ("Fleet Import Dialog", "Acervator - no saved fleet")
          MAIN = ("Acervator Main Window", "Acervator v")
          PICKER = ("Pick a fleet file",)
          IMPORT = "Import a fleet file..."
          OPEN = "Open"
          FIELD = "File name:"
          BUTTON = ("button",)
          FIELDS = ("text", "entry")
          REFUSAL = "is not a fleet file, because it does not hold JSON text."
          LOADED = "Imported fleet: 2 of 2 bot(s) loaded."
          READY = "main window displayed"
          # A log pane or log line naming a symbol is not a listed bot.
          LOG_KINDS = ("text:",)
          LOG_MARKS = ("[INFO]", "[WARNING]", "[ERROR]", "[DEBUG]",
                       "acervator.")
          STAMP = re.compile(r"^(?:\S+:? )?\[?\d\d:\d\d:\d\d")

          root = Path(os.environ["IMPORT_ROOT"])
          limit = int(os.environ["LAUNCH_WAIT_SECONDS"])
          root.mkdir(parents=True, exist_ok=True)
          os.environ["DISPLAY"] = DISPLAY
          xvfb = subprocess.Popen(
              ["Xvfb", DISPLAY, "-screen", "0", "1920x1080x24", "-nolisten",
               "tcp"],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          )
          for _ in range(30):
              probe = ["xdpyinfo", "-display", DISPLAY]
              if subprocess.run(probe, capture_output=True).returncode == 0:
                  break
              time.sleep(1)
          bus = subprocess.run(
              ["dbus-daemon", "--session", "--fork", "--print-address=1"],
              capture_output=True,
              text=True,
              check=True,
          ).stdout.split()[0]
          os.environ["DBUS_SESSION_BUS_ADDRESS"] = bus

          import gi

          gi.require_version("Atspi", "2.0")
          from gi.repository import Atspi, Gio, GLib

          # org.a11y.Bus starts the accessibility bus; Qt and libatspi share it.
          reply = Gio.bus_get_sync(Gio.BusType.SESSION, None).call_sync(
              "org.a11y.Bus",
              "/org/a11y/bus",
              "org.a11y.Bus",
              "GetAddress",
              None,
              GLib.VariantType.new("(s)"),
              Gio.DBusCallFlags.NONE,
              20000,
              None,
          )
          a11y = reply.unpack()[0]
          os.environ["AT_SPI_BUS_ADDRESS"] = a11y
          print(f"accessibility bus: {a11y}")
          print(f"Atspi.init answered {Atspi.init()}")
          failures = []
          errors = []


          def wait_for(read, seconds):
              """Poll read each second until it answers truthy or time ends."""
              end = time.monotonic() + seconds
              while True:
                  try:
                      found = read()
                  except Exception as exc:
                      errors.append(f"{type(exc).__name__}: {exc}")
                      found = None
                  if found or time.monotonic() > end:
                      return found
                  time.sleep(1)


          def applications():
              """Each AT-SPI application with its pid and top-level names."""
              desktop = Atspi.get_desktop(0)
              held = []
              for index in range(desktop.get_child_count()):
                  app = desktop.get_child_at_index(index)
                  if app is None:
                      continue
                  names = []
                  for inner in range(app.get_child_count()):
                      frame = app.get_child_at_index(inner)
                      names.append(frame.get_name() if frame else None)
                  pid = app.get_process_id()
                  held.append(f"{app.get_name()} {pid} {names}")
              return held


          def ready(home):
              """True once a file under the home's log tree names READY."""
              logs = home / ".acervator_logs"
              for path in logs.rglob("*") if logs.exists() else []:
                  if not path.is_file():
                      continue
                  if READY in path.read_text("utf-8", "ignore"):
                      return True
              return False


          def frames():
              """Every top-level window each AT-SPI application holds."""
              desktop = Atspi.get_desktop(0)
              for index in range(desktop.get_child_count()):
                  app = desktop.get_child_at_index(index)
                  if app is None:
                      continue
                  for inner in range(app.get_child_count()):
                      frame = app.get_child_at_index(inner)
                      if frame is not None:
                          yield frame


          def window(prefix):
              """The first top-level window whose name starts with prefix."""
              for frame in frames():
                  if (frame.get_name() or "").startswith(prefix):
                      frame.clear_cache()
                      return frame
              return None


          def walk(node):
              """node and every descendant AT-SPI reports."""
              stack = [node]
              while stack:
                  one = stack.pop()
                  yield one
                  try:
                      count = one.get_child_count()
                  except Exception:
                      continue
                  for index in range(count):
                      try:
                          child = one.get_child_at_index(index)
                      except Exception:
                          child = None
                      if child is not None:
                          stack.append(child)


          def role(node):
              """The AT-SPI role name of node."""
              try:
                  return node.get_role_name()
              except Exception:
                  return "unknown"


          def strings(node):
              """The name and the text one AT-SPI node exposes."""
              found = []
              try:
                  found.append(node.get_name() or "")
              except Exception:
                  pass
              try:
                  text = node.get_text_iface()
                  if text is not None:
                      size = Atspi.Text.get_character_count(text)
                      found.append(Atspi.Text.get_text(text, 0, size))
              except Exception:
                  pass
              return [" ".join(one.split()) for one in found if one]


          def tree(node):
              """Each string under node, prefixed with its role."""
              rows = []
              for one in walk(node):
                  rows.extend(f"{role(one)}: {text}" for text in strings(one))
              return rows


          def find(node, kinds, name):
              """The first node under node named name, its role in kinds."""
              for one in walk(node):
                  held = role(one)
                  if any(kind in held for kind in kinds):
                      if (one.get_name() or "") == name:
                          return one
              return None


          def press(node):
              """Run the press action of node and answer its action names."""
              action = node.get_action_iface()
              count = Atspi.Action.get_n_actions(action)
              names = [Atspi.Action.get_action_name(action, i)
                       for i in range(count)]
              wanted = [i for i, name in enumerate(names)
                        if name.lower() in ("press", "click", "activate")]
              Atspi.Action.do_action(action, wanted[0] if wanted else 0)
              return names


          def bot_rows(rows, symbol):
              """Rows naming symbol that are not log text."""
              return [
                  row for row in rows
                  if symbol in row
                  and not row.startswith(LOG_KINDS)
                  and not STAMP.match(row)
                  and not any(mark in row for mark in LOG_MARKS)
              ]


          def fleet_symbols(good):
              """Each bot id in the fleet file mapped to its symbol."""
              bots = json.loads(good.read_text("utf-8"))["bots"]
              return {bid: one["config"]["symbol"] for bid, one in bots.items()}


          def listing(symbols):
              """Rows of the main window listing each symbol, else None."""
              rows = tree(window(MAIN))
              named = {one: bot_rows(rows, one) for one in symbols}
              loaded = [row for row in rows if LOADED in row]
              if all(named.values()):
                  return {"bot rows": named, "loaded line": loaded}
              return None


          def sha(path):
              """The SHA-256 of the bytes at path."""
              return hashlib.sha256(path.read_bytes()).hexdigest()


          def capture(home, label):
              """Save the whole display beside the home's readings."""
              try:
                  from PIL import ImageGrab

                  shot = ImageGrab.grab(xdisplay=DISPLAY)
                  shot.save(home / f"import-{label}.png")
              except Exception as exc:
                  print(f"capture {label} failed: {exc}")


          def pick(path, seen, label):
              """Press IMPORT, then answer the picker with path."""
              button = find(window(DIALOG), BUTTON, IMPORT)
              seen[f"{label} press actions"] = press(button)
              picker = wait_for(lambda: window(PICKER), 30)
              if picker is None:
                  raise RuntimeError("no picker window opened")
              seen[f"{label} picker strings"] = tree(picker)
              field = find(picker, FIELDS, FIELD)
              editable = field.get_editable_text_iface()
              Atspi.EditableText.set_text_contents(editable, str(path))
              seen[f"{label} field"] = strings(field)
              press(find(window(PICKER), BUTTON, OPEN))
              closed = wait_for(lambda: window(PICKER) is None, 30)
              seen[f"{label} picker closed"] = bool(closed)


          def press_and_read(variant, home, seen):
              """Take every reading on one running AppImage."""
              files = home / "fleet-files"
              good = files / "bot_state.json"
              bad = files / "not_a_fleet.json"
              expected = home / ".acervator" / "bot_state.json"
              seen["good file sha256"] = sha(good)
              symbols = fleet_symbols(good)
              seen["fleet file bots"] = symbols
              logged = wait_for(lambda: ready(home), limit)
              seen["main window line"] = bool(logged)
              dialog = wait_for(lambda: window(DIALOG), 120)
              main = window(MAIN)
              seen["first-run screen"] = dialog.get_name() if dialog else None
              seen["main window under it"] = main.get_name() if main else None
              seen["at-spi applications"] = applications()
              seen["errors while waiting"] = errors[-5:]
              if dialog is None:
                  failures.append(f"{variant}: the screen never opened")
                  return
              time.sleep(15)
              seen["expected place, nothing pressed"] = expected.exists()
              if expected.exists():
                  failures.append(f"{variant}: a fleet appeared unpressed")
              before = tree(window(MAIN))
              seen["bot rows before"] = {
                  one: bot_rows(before, one) for one in symbols.values()
              }
              seen["screen strings, open"] = tree(window(DIALOG))
              capture(home, "1-open")

              pick(bad, seen, "bad file")
              shown = []

              def refusal():
                  shown[:] = tree(window(DIALOG))
                  return [row for row in shown if REFUSAL in row]

              said = wait_for(refusal, 30) or []
              seen["screen strings, bad file"] = shown
              seen["refusal sentence read"] = said
              seen["screen open after bad file"] = window(DIALOG) is not None
              seen["expected place after bad file"] = expected.exists()
              capture(home, "2-refused")
              if not said:
                  failures.append(f"{variant}: no refusal sentence was read")
              if expected.exists():
                  failures.append(f"{variant}: the bad file wrote the place")

              pick(good, seen, "good file")
              closed = wait_for(lambda: window(DIALOG) is None, 60)
              seen["screen closed after good file"] = bool(closed)
              written = wait_for(expected.exists, 30)
              seen["expected place after good file"] = bool(written)
              if not written:
                  failures.append(f"{variant}: the good file wrote nothing")
                  return
              seen["expected place sha256"] = sha(expected)
              if seen["expected place sha256"] != seen["good file sha256"]:
                  failures.append(f"{variant}: the written bytes differ")
              found = wait_for(lambda: listing(symbols.values()), 120)
              seen["main window after good file"] = found
              capture(home, "3-imported")
              if not found:
                  failures.append(f"{variant}: the bots were not listed")


          def read_variant(variant):
              """Launch one AppImage on its import home and read it."""
              home = root / variant
              (home / "tmp").mkdir(parents=True, exist_ok=True)
              image = next(Path("dist").glob(f"*-{variant}.AppImage"))
              env = {
                  "PATH": "/usr/bin:/bin",
                  "HOME": str(home),
                  "TMPDIR": str(home / "tmp"),
                  "LANG": "C.UTF-8",
                  "DISPLAY": DISPLAY,
                  "DBUS_SESSION_BUS_ADDRESS": bus,
                  "AT_SPI_BUS_ADDRESS": a11y,
                  "QT_LINUX_ACCESSIBILITY_ALWAYS_ON": "1",
                  "ACERVATOR_DEBUG_BOOT": "1",
              }
              out = (home / "import-stdout.txt").open("w")
              err = (home / "import-stderr.txt").open("w")
              proc = subprocess.Popen(
                  [str(image.resolve())],
                  env=env,
                  stdout=out,
                  stderr=err,
                  start_new_session=True,
              )
              seen = {"variant": variant, "pid": proc.pid}
              try:
                  press_and_read(variant, home, seen)
              except Exception:
                  failures.append(f"{variant}: {traceback.format_exc()}")
              finally:
                  # SIGTERM lets the AppImage runtime unmount its FUSE folder.
                  for stop in (signal.SIGTERM, signal.SIGKILL):
                      try:
                          os.killpg(proc.pid, stop)
                      except ProcessLookupError:
                          break
                      try:
                          proc.wait(timeout=15)
                          break
                      except subprocess.TimeoutExpired:
                          continue
                  for name in (image.stem, "QtWebEngineProcess"):
                      subprocess.run(["pkill", "-9", "-f", name], check=False)
                  for mount in (home / "tmp").glob(".mount_*"):
                      subprocess.run(
                          ["fusermount3", "-u", "-z", str(mount)], check=False
                      )
                  out.close()
                  err.close()
              readings = home / "import-readings.json"
              readings.write_text(json.dumps(seen, indent=2), "utf-8")
              return seen


          for variant in os.environ["VARIANTS"].split():
              print("=" * 50)
              print(f"=== {variant}: the fleet import, pressed through AT-SPI")
              print("=" * 50)
              for key, value in read_variant(variant).items():
                  dumped = json.dumps(value, indent=2)
                  print(f"READING {variant} {key}: {dumped}")
          xvfb.terminate()
          for failure in failures:
              print(f"FAILURE {failure}")
          sys.exit(1 if failures else 0)

      - name: Upload the AppImages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acervator-linux
          path: dist/*.AppImage
          if-no-files-found: error
          compression-level: 0

      - name: Upload what the launches produced
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acervator-linux-launch-evidence
          path: ${{ env.LAUNCH_ROOT }}
          include-hidden-files: true
          if-no-files-found: warn
