---
version: 2
updates:
  # pyproject.toml
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  # requirements/build-win32-py3.14.txt
  - package-ecosystem: "pip"
    directory: "/requirements"
    schedule:
      interval: "weekly"

  # package.json and package-lock.json
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  # desktop/package.json and desktop/package-lock.json
  - package-ecosystem: "npm"
    directory: "/desktop"
    schedule:
      interval: "weekly"

  # the actions .github/workflows/ pins
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
