---
version: 2

# current is the default branch, so version and security updates both open
# against it.
updates:
  # pyproject.toml
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "current"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      routine-versions:
        applies-to: version-updates
        patterns:
          - "*"
      security-fixes:
        applies-to: security-updates
        patterns:
          - "*"

  # requirements/build-win32-py3.14.txt
  - package-ecosystem: "pip"
    directory: "/requirements"
    target-branch: "current"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      routine-versions:
        applies-to: version-updates
        patterns:
          - "*"
      security-fixes:
        applies-to: security-updates
        patterns:
          - "*"

  # package.json and package-lock.json
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "current"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      routine-versions:
        applies-to: version-updates
        patterns:
          - "*"
      security-fixes:
        applies-to: security-updates
        patterns:
          - "*"

  # desktop/package.json and desktop/package-lock.json
  - package-ecosystem: "npm"
    directory: "/desktop"
    target-branch: "current"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      routine-versions:
        applies-to: version-updates
        patterns:
          - "*"
      security-fixes:
        applies-to: security-updates
        patterns:
          - "*"

  # the action versions in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "current"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      routine-versions:
        applies-to: version-updates
        patterns:
          - "*"
      security-fixes:
        applies-to: security-updates
        patterns:
          - "*"
