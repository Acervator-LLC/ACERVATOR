[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acervator"
# Issue #70 — the version is NOT restated here. setuptools>=69 reads it
# straight out of src/__init__.py via [tool.setuptools.dynamic] below, so
# src.__version__ is the one source and this file cannot drift from it.
dynamic = ["version"]
description = "Multi-exchange crypto auto-trading platform with Grid and Speculative Scrumming modes"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "ccxt>=4.2.0",
    "cryptography>=42.0.0",
    "keyring>=25.0.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "ta>=0.11.0",
    "tomli_w>=1.0.0",
    "aiohttp>=3.9.0",
    "psutil>=5.9.0",
    "defusedxml>=0.7.1",
]

[project.scripts]
acervator = "main:main"

[tool.setuptools.dynamic]
# Read by setuptools' static AST reader — src/__init__.py assigns
# __version__ as a plain string literal, so this resolves without
# importing the package (no PySide6 needed at build time).
version = {attr = "src.__version__"}

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Issue #69 - this block used to exclude `tests/obsolete` (TD-022) and
# `tests/test_swarm_row_parity.py` (TD-021). Those two paths are not in
# the tree and never have been. An `--ignore=` for a path that is not in
# the tree is inert: pytest accepts it and collects the same 7382 tests
# either way. Both entries are gone, so this block states only what it
# does.
norecursedirs = ["__pycache__", ".git"]

# v3.19.7 - Coverage configuration. Coverage is NOT enabled by default
# (it slows the suite by about 3x). Run it explicitly:
#
#     python -m pytest --cov=src --cov-report=term --cov-report=json
#
# Issue #69 - this comment used to name a coverage-floor regression test
# (`tests/test_coverage_floor.py`) that compared per-module coverage to
# `qa_baselines/coverage_baseline.json`. That test is not in the tree,
# and neither is that baseline. No test in the suite reads a coverage
# baseline, so no floor is enforced. The claim is gone, not restated.
#
# `[tool.coverage.json] output` below is a WRITE target, not a read:
# coverage creates `qa_baselines/` on demand. It is not a dead
# reference.
[tool.coverage.run]
branch = true
# v3.19.7 — Source paths. acervator_watchdog.py lives at repo root
# (not under src/) because PyInstaller's entry point treats it as a
# top-level launcher. We add it as a file-level source so coverage
# can track it.
source = ["src", "acervator_watchdog.py"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.session*_backups/*",
    "src/gui/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false

[tool.coverage.json]
output = "qa_baselines/coverage_current.json"
show_contexts = false

# Issue #69 - the [tool.mutmut] block is gone. Measured 2026-08-22: its
# `runner` named `tests/test_verify_buy_safe_helper.py` and
# `tests/test_mem228_buy_confirmation_gate.py`. Neither file is in the
# tree, and pytest exits 4 on a missing path. mutmut reads any non-zero
# exit as "mutant killed", so `python -m mutmut run` reported every
# mutant killed while it ran zero tests. The pinned baseline
# (`qa_baselines/mutation_baseline.json`), its reader
# (`tests/test_mutation_baseline.py`) and `tools/mutation_runner.py` are
# not in the tree either. Nothing exercises `src/trading/buy_safety.py`
# directly, so there is no honest runner to name. Writing one is a
# separate unit. Inventing one to satisfy this config would be worse
# than deleting it.

# v3.19.14 — Vulture configuration. The four remaining findings after
# v3.19.12's cleanup are all function/callback parameter signatures
# vulture can't distinguish from genuine unused variables. The
# --ignore-names list excludes them so the baseline can land at 0.
#
# To re-run vulture with this config:
#   python -m vulture src acervator_watchdog.py \
#     --min-confidence 70 \
#     --ignore-names "fold_hold_in_downtrend,value_at_bar_end,prev_col,prev_row"
#
# Pyproject [tool.vulture] is read by vulture 2.x via pyproject.toml
# when invoked from a directory containing it.
[tool.vulture]
ignore_names = [
    # v3.19.12 documented false-positives on API/callback parameters:
    "fold_hold_in_downtrend",   # run_v3192 function param (public API)
    "value_at_bar_end",          # bar_h chart helper param (public API)
    "prev_col",                  # Qt QTableWidget.currentCellChanged slot
    "prev_row",                  # Qt QTableWidget.currentCellChanged slot
]
paths = ["src", "acervator_watchdog.py"]
min_confidence = 70
