[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acervator"
# Issue #70 — the version is NOT restated here. setuptools>=69 reads it
# straight out of src/__init__.py via [tool.setuptools.dynamic] below, so
# src.__version__ is the one source and this file cannot drift from it.
dynamic = ["version"]
description = "Multi-exchange crypto auto-trading platform with Grid and Speculative Scrumming modes"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "ccxt>=4.2.0",
    "cryptography>=42.0.0",
    "keyring>=25.0.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "ta>=0.11.0",
    "tomli_w>=1.0.0",
    "aiohttp>=3.9.0",
    "psutil>=5.9.0",
    "defusedxml>=0.7.1",
]

[project.scripts]
acervator = "main:main"

[tool.setuptools.dynamic]
# Read by setuptools' static AST reader — src/__init__.py assigns
# __version__ as a plain string literal, so this resolves without
# importing the package (no PySide6 needed at build time).
version = {attr = "src.__version__"}

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# TD-022: legacy / no-longer-applicable regression tests live here; do not collect.
# TD-021: test_swarm_row_parity reads source under default codec; ignore until encoding fix ships.
norecursedirs = ["obsolete", "__pycache__", ".git"]
addopts = "--ignore=tests/obsolete --ignore=tests/test_swarm_row_parity.py"

# v3.19.7 — Coverage configuration. Coverage is NOT enabled by default
# (would slow the 1533-test suite by ~3×). Operator runs coverage
# explicitly via:
#
#     python -m pytest --cov=src --cov=sadp/RAIntSimBat \
#                      --cov-report=term --cov-report=json
#
# The coverage-floor regression test (tests/test_coverage_floor.py)
# does a focused per-module coverage check in-process and compares
# to qa_baselines/coverage_baseline.json. Tighter focus = faster.
[tool.coverage.run]
branch = true
# v3.19.7 — Source paths. acervator_watchdog.py lives at repo root
# (not under src/) because PyInstaller's entry point treats it as a
# top-level launcher. We add it as a file-level source so coverage
# can track it.
source = ["src", "sadp/RAIntSimBat", "acervator_watchdog.py"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.session*_backups/*",
    "sadp/RAIntSimBat/run_all.py",
    "sadp/RAIntSimBat/package_run.py",
    "sadp/RAIntSimBat/reports_pdf.py",
    "sadp/RAIntSimBat/ab_report.py",
    "src/gui/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false

[tool.coverage.json]
output = "qa_baselines/coverage_current.json"
show_contexts = false

# v3.19.7 — Mutation testing configuration. mutmut runs against a
# focused, money-critical target set (buy_safety.py first; expand as
# the harness matures). Run on-demand:
#
#     python -m mutmut run
#     python -m mutmut results
#
# Baseline + survivor list pinned in qa_baselines/mutation_baseline.json;
# tests/test_mutation_baseline.py reads it and asserts the surviving-
# mutation count for each target file has not grown.
[tool.mutmut]
paths_to_mutate = "src/trading/buy_safety.py"
backup = false
runner = "python -m pytest tests/test_verify_buy_safe_helper.py tests/test_mem228_buy_confirmation_gate.py -x -q"
tests_dir = "tests/"

# v3.19.14 — Vulture configuration. The four remaining findings after
# v3.19.12's cleanup are all function/callback parameter signatures
# vulture can't distinguish from genuine unused variables. The
# --ignore-names list excludes them so the baseline can land at 0.
#
# To re-run vulture with this config:
#   python -m vulture src sadp/RAIntSimBat acervator_watchdog.py \
#     --min-confidence 70 \
#     --ignore-names "fold_hold_in_downtrend,value_at_bar_end,prev_col,prev_row"
#
# Pyproject [tool.vulture] is read by vulture 2.x via pyproject.toml
# when invoked from a directory containing it.
[tool.vulture]
ignore_names = [
    # v3.19.12 documented false-positives on API/callback parameters:
    "fold_hold_in_downtrend",   # run_v3192 function param (public API)
    "value_at_bar_end",          # bar_h chart helper param (public API)
    "prev_col",                  # Qt QTableWidget.currentCellChanged slot
    "prev_row",                  # Qt QTableWidget.currentCellChanged slot
]
paths = ["src", "sadp/RAIntSimBat", "acervator_watchdog.py"]
min_confidence = 70
