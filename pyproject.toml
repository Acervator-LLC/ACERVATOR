[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acervator"
# Issue #70 — the version is NOT restated here. setuptools>=69 reads it
# straight out of src/__init__.py via [tool.setuptools.dynamic] below, so
# src.__version__ is the one source and this file cannot drift from it.
dynamic = ["version"]
description = "Multi-exchange crypto auto-trading platform with Grid and Speculative Scrumming modes"
readme = "README.md"
license = {text = "Proprietary"}
# CI pins ONE interpreter, in .python-version at the repo root; this bound
# and that file must agree.
requires-python = ">=3.14,<3.15"
# Issue #94 - THIS IS THE ONE DEPENDENCY SOURCE.
#
# Before this issue the pip install list was hand-copied into eight
# places and no two of them agreed. `tools/deps.py` now READS this
# block, and `build_windows.ps1`, `build_mac.sh`, `BUILD.py`,
# `deploy/kiosk/install.sh` and `deploy/kiosk/update.sh` call that tool
# instead of holding a list. `tests/test_one_dependency_source.py` fails if a new
# hand-copied list appears anywhere in the tree.
#
# A requirement belongs in `dependencies` when the code imports it and
# the code cannot run without it. A requirement whose absence the code
# TOLERATES belongs in an extra below, and the guard that tolerates it
# is named there.
dependencies = [
    "PySide6>=6.6.0",
    "ccxt>=4.2.0",
    "cryptography>=42.0.0",
    "keyring>=25.0.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "ta>=0.11.0",
    "tomli_w>=1.0.0",
    "aiohttp>=3.9.0",
    "psutil>=5.9.0",
    "defusedxml>=0.7.1",
    # certifi builds the TLS trust store for exchange calls. Three files
    # call certifi.where(): src/exchange/ccxt_connector.py,
    # src/gui/widgets/api_tester_tab.py and tools/exchange_diagnostic.py.
    "certifi>=2024.2.2",
]

# Issue #94 - EXTRAS. Each one names its consumer and the guard that
# proves the code survives its absence. Nothing goes here on taste.
#
#   report   `VersionSweep.save_pdf_report` in src/core/version_sweep.py
#            imports reportlab inside `try:` and answers None on
#            ImportError. The sweep still runs and writes its JSON report.
#   charts   src/design_system.py imports matplotlib at module level with
#            NO guard. It is an extra and not a core dependency for a
#            different reason: no tracked module imports
#            `src.design_system`, and both .spec files list 'matplotlib'
#            in `EXCLUDES`, so the frozen application never reaches that
#            import.
#   monitor  `LiveMonitor._call` in src/trading/live_monitor.py imports
#            httpx with no guard. No install list in the tree ever
#            installed it. This extra declares that dependency; it does
#            not make it optional.
#   contracts  `contracts/deploy.py` is a standalone CLI that deploys
#            ACRV.sol and CompetitionRegistry.sol to Base Sepolia or Base
#            Mainnet. It imports web3, eth_account and solcx. It is an
#            extra, and not a core dependency, for the same reason
#            `charts` is: no code in the product reaches it. No file in
#            the tree imports `contracts.deploy`, neither .spec file
#            collects `contracts/`, and `acrv_address` and
#            `registry_address` in src/competition/base_config.py are all
#            the empty string, so the deployment has never completed on
#            any machine. The three imports sit inside `try:` with an
#            `except ImportError` that names this extra, so the script
#            states what to install instead of pip-installing behind the
#            operator.
#            NO LOWER BOUND IS STATED, and that is deliberate. A bound
#            would be a guess: none of the three has been resolved,
#            installed or run anywhere this project has measured.
#            `python -m tools.deps lock contracts` pins them the first
#            time one is.
#            `src/competition/` needs NONE of these. An AST walk over its
#            modules finds one third-party import, `cryptography` in
#            src/competition/bot_identity.py, and that is already a core
#            dependency above.
#   display  src/core/mini_display.py imports luma, ST7789, RPLCD and
#            smbus2, each inside `try:` with an `except` that returns
#            False, so a machine with no panel reports "not connected".
#            Raspberry Pi only. ST7789 and waveshare_epd stay out of the
#            extra: `deploy/kiosk/install.sh` says they are
#            hardware-specific and installs neither.
#   build    PyInstaller host only. The TARGET never needs it.
#   dev      the tools `dev_harness/harness/coding_archetype.py` and
#            `docs_archetype.py` spawn, plus the type stubs two files
#            need to stay green. Lower bounds are the versions that
#            measured green on 2026-08-23, not guesses.
[project.optional-dependencies]
# CI fast lane installs THIS and nothing else: 4 packages, no analyzers.
# CI lint job installs THIS. A package name lives in this file, never in
# a workflow step (issue #94).
lint = ["black>=24.0", "flake8>=7.0"]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-qt>=4.4",
    "pytest-xdist>=3.8.0",
]
report = ["reportlab>=4.0.0"]
charts = ["matplotlib>=3.8.0"]
monitor = ["httpx>=0.27.0"]
contracts = ["web3", "eth-account", "py-solc-x"]
display = [
    "luma.oled>=3.13.0",
    "RPLCD>=1.3.1",
    "smbus2>=0.4.3",
    "pillow>=10.0.0",
]
build = ["pyinstaller>=6.0.0", "pillow>=10.0.0"]
dev = [
    # PEP 621 self-reference: dev is a strict superset of test.
    "acervator[test]",
    # The CI lint job runs black+flake8; the full lane shells out to the rest.
    "acervator[lint]",
    # coding_archetype.py shells out to SIX analyzers - ruff, mypy, pyright,
    # bandit, vulture, semgrep. pyright is a bare-executable runner, so it
    # must be on PATH or every archetype test fails closed with
    # "pyright: not installed".
    "semgrep>=1.0",
    "opencv-python-headless>=4.8",
    "ruff>=0.16.0",
    "mypy>=2.1.0",
    "bandit>=1.9.4",
    "vulture>=2.16",
    "pyright>=1.1.411",
    "proselint>=0.16.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.8.0",
    # Issue #94 - types-reportlab was installed by hand to clear a mypy
    # `import-untyped` finding on two files, and was declared nowhere.
    # The green on those files was not reproducible on another machine.
    # It is a stub-only distribution, so it belongs with the type
    # checker and never in `dependencies`.
    "types-reportlab>=4.5.1.20260807",
    # Issue #94 - the lockfile generator. `requirements/` holds what it
    # produced; `python -m tools.deps lock` regenerates it.
    "pip-tools>=7.6.1",
]

[project.scripts]
acervator = "main:main"

# Formatting (black). Enforced in CI by `black --check`; .flake8 is kept in
# sync with it - line length 88, E203/W503 ignored because black owns them.
[tool.black]
line-length = 88
# The syntax black may EMIT, not the interpreter pin. py314 rewrites 62 files
# to PEP 758 unparenthesised `except`, which no earlier Python parses.
target-version = ["py313"]
extend-exclude = "tests/obsolete"

[tool.setuptools.dynamic]
# src/__init__.py derives __version__ from src/_version.py, so the static
# AST reader finds no literal and setuptools imports the package instead.
# That import stays cheap: src/__init__.py pulls in stdlib only, never
# PySide6.
version = {attr = "src.__version__"}

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Issue #69 - this block used to exclude `tests/obsolete` (TD-022) and
# `tests/test_swarm_row_parity.py` (TD-021). Those two paths are not in
# the tree and never have been. An `--ignore=` for a path that is not in
# the tree is inert: pytest accepts it and collects the same 7382 tests
# either way. Both entries are gone, so this block states only what it
# does.
norecursedirs = ["__pycache__", ".git"]

# RULE: "A silent capture is a failed capture." — see the
# `_silent_capture_guard` fixture in tests/conftest.py. The marker is
# the guard's only opt-out and is registered here so an unknown-mark
# warning can never be mistaken for the guard being inert.
markers = [
    "caplog_may_be_empty(reason): this test watches a NON-Acervator logger and an empty caplog is its pass condition",    # CI lanes, applied by file in tests/conftest.py. Fast lane runs
    # `-m "not slow and not archetype"`; the full lane runs the complement.
    "slow: end-to-end engine-replay suite; heavy CPU, deferred to the full CI lane",
    "archetype: archetype-harness test needing the [dev] analyzer toolchain",
]

# v3.19.7 - Coverage configuration. Coverage is NOT enabled by default
# (it slows the suite by about 3x). Run it explicitly:
#
#     python -m pytest --cov=src --cov-report=term --cov-report=json
#
# Issue #69 - this comment used to name a coverage-floor regression test
# (`tests/test_coverage_floor.py`) that compared per-module coverage to
# `qa_baselines/coverage_baseline.json`. That test is not in the tree,
# and neither is that baseline. No test in the suite reads a coverage
# baseline, so no floor is enforced. The claim is gone, not restated.
#
# `[tool.coverage.json] output` below is a WRITE target, not a read:
# coverage creates `qa_baselines/` on demand. It is not a dead
# reference.
[tool.coverage.run]
branch = true
# v3.19.7 — Source paths. acervator_watchdog.py lives at repo root
# (not under src/) because PyInstaller's entry point treats it as a
# top-level launcher. We add it as a file-level source so coverage
# can track it.
source = ["src", "acervator_watchdog.py"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.session*_backups/*",
    "src/gui/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false

[tool.coverage.json]
output = "qa_baselines/coverage_current.json"
show_contexts = false

# Issue #69 - the [tool.mutmut] block is gone. It could not run, for two
# independent reasons, both measured 2026-08-22.
#
# 1. mutmut 3.5.0 refuses this platform. `python -m mutmut run` prints
#    "To run mutmut on Windows, please use the WSL" and exits 1 at
#    import (mutmut/__main__.py, lines 8-10). It never reads this
#    config.
# 2. Its `runner` named `tests/test_verify_buy_safe_helper.py` and
#    `tests/test_mem228_buy_confirmation_gate.py`. Those files are not
#    in the tree, and `git log` over all 107 commits shows no commit
#    ever added them. That command exits 4.
#
# The pinned baseline (`qa_baselines/mutation_baseline.json`), its
# reader (`tests/test_mutation_baseline.py`) and `tools/mutation_runner
# .py` are not in the tree either, and were never added by any commit.
# So no number in this repository rests on this block. Nothing exercises
# `src/trading/buy_safety.py` directly, so there is no honest runner to
# name. Writing one is a separate unit. Inventing one to satisfy this
# config would be worse than deleting it.

# v3.19.14 — Vulture configuration. The four remaining findings after
# v3.19.12's cleanup are all function/callback parameter signatures
# vulture can't distinguish from genuine unused variables. The
# --ignore-names list excludes them so the baseline can land at 0.
#
# To re-run vulture with this config:
#   python -m vulture src acervator_watchdog.py \
#     --min-confidence 70 \
#     --ignore-names "fold_hold_in_downtrend,value_at_bar_end,prev_col,prev_row"
#
# Pyproject [tool.vulture] is read by vulture 2.x via pyproject.toml
# when invoked from a directory containing it.
[tool.vulture]
ignore_names = [
    # v3.19.12 documented false-positives on API/callback parameters:
    "fold_hold_in_downtrend",   # run_v3192 function param (public API)
    "value_at_bar_end",          # bar_h chart helper param (public API)
    "prev_col",                  # Qt QTableWidget.currentCellChanged slot
    "prev_row",                  # Qt QTableWidget.currentCellChanged slot
]
paths = ["src", "acervator_watchdog.py"]
min_confidence = 70
