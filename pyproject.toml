[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-auto-trader"
version = "1.0.0"
description = "Multi-exchange crypto auto-trading platform with Grid and Speculative Scrumming modes"
readme = "README.md"
# Single supported interpreter, pinned in .python-version at the repo root.
# Acervator targets one Python; there is no multi-version support or testing.
requires-python = ">=3.13,<3.14"
dependencies = [
    "PySide6>=6.6.0",
    "ccxt>=4.2.0",
    "cryptography>=42.0.0",
    "keyring>=25.0.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "ta>=0.11.0",
    "tomli_w>=1.0.0",
    "aiohttp>=3.9.0",
    "psutil>=5.9.0",
    "defusedxml>=0.7.1",
]

# Dev/CI tooling. Kept out of the runtime dependency list so a packaged
# build never ships them. Two extras, so CI's fast lane installs only what
# the core suite needs:
#   [test] — the lean set to run `pytest` (fast lane, every push/PR).
#   [dev]  — everything: [test] plus black/flake8 and the archetype analyzers
#            (slow/full lane only, plus local development).
[project.optional-dependencies]
# Lean test runtime. `pytest-xdist` gives `-n auto` process parallelism, the
# single biggest CI wall-clock win on this CPU-bound suite.
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-qt>=4.4",
    "pytest-xdist>=3.5",
]
dev = [
    # Self-reference (PEP 621): dev is a strict superset of test.
    "quantum-auto-trader[test]",
    "black>=24.0",
    "flake8>=7.0",
    # Analyzers the archetype-review harness (tools/harness/*_archetype.py)
    # shells out to. Without them ArchetypeReport.passed fails closed
    # ("<tool>: not installed"), so the archetype test suite needs them on
    # PATH. `vale` (docs prose) is an optional Go binary, not pip-installable,
    # and the docs archetype treats it as available-if-present. These are
    # heavy (semgrep, opencv) — the fast lane deliberately does NOT install
    # them, and the archetype tests that need them are marked so the fast
    # lane deselects them (see the `archetype` marker below).
    # coding_archetype.py shells out to SIX analyzers — ruff, mypy, pyright,
    # bandit, vulture, semgrep. pyright was missing from this list, so every
    # coding-archetype test failed closed in CI's test-full lane with
    # "pyright: not installed" (ArchetypeReport.passed=False). pyright is a
    # bare-executable runner (like semgrep), so it must be on PATH — the pip
    # package installs the launcher; it fetches its Node runtime on first run.
    "ruff>=0.1",
    "bandit>=1.7",
    "mypy>=1.0",
    "pyright>=1.1",
    "vulture>=2.0",
    "semgrep>=1.0",
    "proselint>=0.13",
    "opencv-python-headless>=4.8",
]

[project.scripts]
quantum-trader = "main:main"

# ── Formatting (black) ──────────────────────────────────────────────
# Enforced in CI by `black --check`. flake8 is configured to match (see
# .flake8): line length 88, E203/W503 ignored because black owns them.
[tool.black]
line-length = 88
target-version = ["py313"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["__pycache__", ".git"]
# Lanes. `tests/conftest.py::pytest_collection_modifyitems` applies these by
# file, so no per-file `pytestmark` is needed:
#   slow      — end-to-end engine-replay suites (full FleetReplayController
#               runs over synthetic candles); minutes of CPU each.
#   archetype — archetype-harness tests that shell out to heavy analyzers
#               (semgrep/mypy/vulture/vale/opencv), installed only via [dev].
# Fast CI lane runs `-m "not slow and not archetype"`; the full lane runs the
# complement. Unknown-marker warnings are errors, so both must be declared.
markers = [
    "slow: end-to-end engine-replay suite; heavy CPU, deferred to the full CI lane",
    "archetype: archetype-harness test needing the [dev] analyzer toolchain",
]

# Coverage is not enabled by default (it slows the suite roughly 3×).
# Operator runs it explicitly:
#
#     python -m pytest --cov=src --cov-report=term --cov-report=json
[tool.coverage.run]
branch = true
# acervator_watchdog.py lives at the repo root (not under src/) because
# PyInstaller's entry point treats it as a top-level launcher. It is added
# as a file-level source so coverage can track it.
source = ["src", "acervator_watchdog.py"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.session*_backups/*",
    "src/gui/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false

[tool.coverage.json]
output = "coverage.json"
show_contexts = false

# Vulture configuration. The ignored names are function/callback parameter
# signatures vulture cannot distinguish from genuinely unused variables, so
# the baseline can land at 0.
#
# To re-run vulture with this config:
#   python -m vulture src acervator_watchdog.py --min-confidence 70
#
# [tool.vulture] is read by vulture 2.x from pyproject.toml when invoked
# from a directory containing it.
[tool.vulture]
ignore_names = [
    "fold_hold_in_downtrend",
    "value_at_bar_end",
    "prev_col",
    "prev_row",
]
paths = ["src", "acervator_watchdog.py"]
min_confidence = 70
